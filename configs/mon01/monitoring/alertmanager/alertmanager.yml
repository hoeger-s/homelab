# /opt/monitoring/alertmanager/alertmanager.yml auf mon01

route:
  receiver: 'ntfy-alerts'

receivers:
  - name: 'ntfy-alerts'
    webhook_configs:
      - url: 'http://ntfy:2586/homelab-alerts?template=alertmanager'
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/ntfy-token
