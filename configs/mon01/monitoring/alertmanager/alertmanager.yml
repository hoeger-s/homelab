# /opt/monitoring/alertmanager/alertmanager.yml auf mon01

route:
  receiver: 'ntfy-alerts'
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: 'ntfy-alerts-critical'

receivers:
  - name: 'ntfy-alerts'
    webhook_configs:
      - url: 'http://ntfy:2586/homelab-alerts?template=alertmanager&priority=default'
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/ntfy-token

  - name: 'ntfy-alerts-critical'
    webhook_configs:
      - url: 'http://ntfy:2586/homelab-alerts?template=alertmanager&priority=urgent'
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/ntfy-token
