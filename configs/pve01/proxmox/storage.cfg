dir: local
	path /var/lib/vz
	content import,vztmpl,iso,backup

lvmthin: local-lvm
	thinpool data
	vgname pve
	content images,rootdir

lvmthin: vm-storage
	thinpool vmdata-thin
	vgname vg-vmdata
	content images,rootdir

dir: hdd-backup
	path /mnt/hdd-storage
	content vztmpl,iso,backup
	is_mountpoint yes
